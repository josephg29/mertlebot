services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Caps total Anthropic-billed requests per day across the instance.
      DEMO_DAILY_LIMIT: "${DEMO_DAILY_LIMIT:-300}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
